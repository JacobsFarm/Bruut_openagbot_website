name: Deploy to GitHub Pages

on:
  push:
    branches: 'main' # Of 'master' afhankelijk van je branch naam

  # Elke twee weken opnieuw bouwen zodat nieuwe YouTube-video's ook op de site
  # verschijnen als er niets aan de code is veranderd. Cron kent geen "om de
  # twee weken", dus draaien we op de 1e en de 15e van de maand.
  # (04:00 UTC; GitHub kan de starttijd bij drukte iets uitstellen.)
  schedule:
    - cron: '0 4 1,15 * *'

  # Handmatig te starten via het Actions-tabblad, bijvoorbeeld vlak nadat je
  # een nieuwe video hebt geüpload en die meteen op de site wilt hebben.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Nooit twee deploys tegelijk; een lopende deploy mag wel afmaken.
concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build_site:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Upload Artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'build/'

  deploy:
    needs: build_site
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
