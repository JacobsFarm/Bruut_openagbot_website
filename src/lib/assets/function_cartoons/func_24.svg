<svg xmlns="http://www.w3.org/2000/svg" viewBox="-40 -30 720 460" width="720" height="460">
<!-- Gegenereerd door scripts/generate-function-cartoons.mjs (functie 24); niet met de hand bewerken. -->
<style> svg { stroke-linecap: round; stroke-linejoin: round; } rect, circle, path, ellipse, polygon { stroke: #1f2a22; stroke-width: 3; } .ns, .hole { stroke: none !important; } .hole-dark { fill: #6f7a73; stroke: none; } .grass { fill: #7cb35b; stroke: none; } .ground-line { stroke: #4f8a3a; stroke-width: 4; } .soil { fill: #9b6b43; stroke: none; } .soil-line { stroke: #6e4a2c; stroke-width: 4; } .furrow { stroke: #7f5433; stroke-width: 3; } .floor { fill: #cfc6b4; stroke: none; } .floor-line { stroke: #a39a88; stroke-width: 4; } .plank { stroke: #b99c6c; stroke-width: 2.5; } .plank-rail { stroke: #a8865a; stroke-width: 10; } .sprout path { fill: #5aa447; stroke: #2f6b2a; stroke-width: 2; } .blade { fill: #5aa447; stroke: #2f6b2a; stroke-width: 2; } .weed { fill: #3f7d34; stroke: #1f4a1c; stroke-width: 2; } .crop path { fill: #6bb04f; stroke: #2f6b2a; stroke-width: 2.5; } .crop.small path { stroke-width: 1.5; } .cloud ellipse { fill: #ffffff; stroke: none; } .rain-cloud ellipse { fill: #c7d0cb; } .sun circle { fill: #f6c945; } .sun path { stroke: #e0a02c; stroke-width: 4; } .star { fill: #fff6c2; stroke: none; animation: twinkle 2.4s ease-in-out infinite; } .tire { fill: #33383a; } .tread { fill: none; stroke: #5d6663; stroke-dasharray: 7 6; stroke-width: 4; } .rim { fill: #dfe5df; } .hub { fill: #e0a02c; } .hub-inner { fill: #c07f14; } .bolt { fill: #fffdf5; stroke-width: 2; } .metal { fill: #b9c3bc; } .dark { fill: #2c3e2c; } .nut { fill: #7b857f; } .motor { fill: #2f9a9e; } .far { opacity: 0.55; } .beam-outline { fill: none; stroke: #1f2a22; stroke-width: 26; stroke-linecap: butt; } .beam { fill: none; stroke: #4a544e; stroke-width: 20; stroke-linecap: butt; } .beam-shine { fill: none; stroke: #6d7972; stroke-width: 3; stroke-linecap: butt; } .hole { fill: #c7cfc9; } .beam-end { fill: #4a544e; } .beam-end-hole { fill: #1f2a22; stroke: none; } .battery { fill: #f08a2c; } .led { fill: #6fcf6f; stroke-width: 2; } .handle { fill: none; stroke-width: 4; } .plus { fill: #4f8a3a; } .generator { fill: #f6c945; } .grille { stroke-width: 2.5; } .puff { fill: #e6eae7; stroke: #9aa39e; stroke-width: 2; } .spark { fill: none; stroke: #e0a02c; stroke-width: 3.5; animation: pulse 0.9s ease-in-out infinite; } .solar { fill: #2d4a7a; } .cells { fill: none; stroke: #8fb3e6; stroke-width: 1.8; } .box { fill: #386938; } .eye { fill: #ffffff; } .pupil { fill: #1f2a22; stroke: none; animation: look 5s ease-in-out infinite; } .mouth { fill: none; stroke-width: 3; } .blink { fill: #6fcf6f; animation: blink 1.6s steps(2, jump-none) infinite; } .dome { fill: #f4f6f4; } .seat { fill: #5b6360; } .skin { fill: #f2c7a0; } .knob { fill: #c0492b; } .lens { fill: #7fc4d6; } .cone { fill: rgba(246, 201, 69, 0.28); stroke: none; } .mist { fill: rgba(127, 196, 214, 0.75); stroke: none; animation: pulse 1.2s ease-in-out infinite; } .water { fill: none; stroke: #7fc4d6; stroke-width: 4; stroke-dasharray: 3 9; animation: flow 0.8s linear infinite; } .signal { fill: none; stroke: #2f9a9e; stroke-width: 3; animation: pulse 1.4s ease-in-out infinite; } .signal.s1 { animation-delay: 0.3s; } .signal.s2 { animation-delay: 0.6s; } .link { fill: none; stroke: #2f9a9e; stroke-width: 3; stroke-dasharray: 2 8; animation: flow 1s linear infinite; } .ray { fill: none; stroke-width: 3.5; } .ray.red { stroke: #c0492b; } .ray.nir { stroke: #8e44ad; } .ring { fill: none; stroke: #c0492b; stroke-dasharray: 10 8; stroke-width: 2.5; animation: flow 1.2s linear infinite; } .beacon { fill: #f08a2c; animation: beacon 0.8s steps(2, jump-none) infinite; } .beam-light { fill: none; stroke: #f6c945; stroke-width: 3; animation: pulse 0.8s ease-in-out infinite; } .goose { fill: none; stroke: #dfe5df; stroke-width: 3; } .needle { stroke: #c0492b; stroke-width: 3.5; } .prop { fill: rgba(223, 229, 223, 0.7); stroke: #9aa39e; stroke-width: 1.5; } .blade-line { fill: none; stroke: #7b857f; stroke-width: 4; stroke-dasharray: 14 6; animation: flow 0.3s linear infinite; } .chain { fill: none; stroke: #2c3e2c; stroke-width: 4; stroke-dasharray: 5 3; animation: flow 0.6s linear infinite; } .sprocket { fill: #e0a02c; stroke-dasharray: 3 2; } .card { fill: #fffdf5; filter: drop-shadow(0 3px 0 #1f2a22); } /* Beweging: draaiende rotors, vallende korrels, wegvliegende brokjes. */ .spin { transform-box: fill-box; transform-origin: center; animation: spin 1.4s linear infinite; } .spin.slow { animation-duration: 3s; } .spin.fast { animation-duration: 0.5s; } .spin.rev { animation-direction: reverse; } .fall { animation: fall 1.3s linear infinite; } .fall-short { animation: fall-short 0.9s linear infinite; } .fly-back { animation: fly-back 1.3s ease-out infinite; } .fly-up { animation: fly-up 1.3s ease-out infinite; } .drip { animation: drip 1.1s ease-in infinite; } .rain { animation: drip 1s linear infinite; } .bob { animation: bob 1.1s ease-in-out infinite; } .pulse { animation: pulse 0.7s ease-in-out infinite; } .saw { animation: saw 0.25s linear infinite alternate; } .sway { animation: sway 1.6s ease-in-out infinite alternate; } .hover { animation: hover 2.2s ease-in-out infinite alternate; } .plant-arm { animation: plant 2.4s ease-in-out infinite; } .flee { animation: flee 3s ease-in infinite; } .charge { animation: pulse 1.5s ease-in-out infinite; } .charge.c1 { animation-delay: 0.3s; } .charge.c2 { animation-delay: 0.6s; } @keyframes spin { to { transform: rotate(360deg); } } @keyframes fall { from { transform: translate(0, -18px); opacity: 0; } 25% { opacity: 1; } to { transform: translate(0, 24px); opacity: 0; } } @keyframes fall-short { from { transform: translate(0, -8px); opacity: 0; } 30% { opacity: 1; } to { transform: translate(0, 10px); opacity: 0; } } @keyframes fly-back { from { transform: translate(14px, 10px); opacity: 0; } 30% { opacity: 1; } to { transform: translate(-22px, -14px); opacity: 0; } } @keyframes fly-up { from { transform: translate(0, 8px); opacity: 0; } 30% { opacity: 1; } to { transform: translate(10px, -20px); opacity: 0; } } @keyframes drip { from { transform: translate(0, -14px); opacity: 0; } 20% { opacity: 1; } to { transform: translate(0, 16px); opacity: 0; } } @keyframes bob { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(0, -4px); } } @keyframes pulse { 0%, 100% { opacity: 0.25; } 50% { opacity: 1; } } @keyframes flow { to { stroke-dashoffset: -24; } } @keyframes saw { from { transform: translateX(-3px); } to { transform: translateX(3px); } } @keyframes sway { from { transform: translateX(-10px); } to { transform: translateX(10px); } } @keyframes hover { from { transform: translateY(-4px); } to { transform: translateY(4px); } } @keyframes plant { 0%, 100% { transform: translateY(-14px); } 50% { transform: translateY(0); } } @keyframes flee { from { transform: translateX(0); } 70% { opacity: 1; } to { transform: translateX(60px); opacity: 0; } } @keyframes blink { 50% { fill: #c0492b; } } @keyframes beacon { 50% { fill: #f6c945; } } @keyframes twinkle { 0%, 100% { opacity: 0.4; } 50% { opacity: 1; } } @keyframes look { 0%, 70%, 100% { transform: translate(0, 0); } 78%, 92% { transform: translate(-5px, -1px); } } @media (prefers-reduced-motion: reduce) { * { animation: none !important; } } </style>
